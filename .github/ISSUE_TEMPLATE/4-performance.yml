name: Performance problem
description: Low FPS, stutters, or the game runs worse than expected.
title: "[Perf] "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        **Where to find your logs** (paste the path into the File Explorer address bar):
        - `%LOCALAPPDATA%\WiiCompiled\Logs` (the runtime still uses this folder name)
        - A portable build keeps them in the `UserData\Logs` folder next to it.

        Every run gets its own folder. Open the **newest** one and attach `console.log`.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I'm on the latest commit of `main` (or the latest release, once there is one).
          required: true
        - label: I searched the existing issues and nobody has reported this yet.
          required: true
        - label: I checked that nothing else was hogging the GPU/CPU (recording software, browser video, etc.).
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The first lines of `console.log` start with `[runtime] WiiCompiled` followed by the version. For a build from source, give the commit hash.
      placeholder: "e.g. v0.1.0, or a1b2c3d"
    validations:
      required: true
  - type: dropdown
    id: pattern
    attributes:
      label: What does the problem look like?
      options:
        - Constant low FPS everywhere
        - Stutters / hitches (mostly smooth, brief freezes)
        - Only certain levels or situations are slow
        - Got worse after an update
        - Slow only while recording/streaming the game window
        - Slow only at a high internal resolution or frame rate
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: When does it happen?
      description: Which levels, how many players, the resolution and frame-rate settings, and roughly what FPS you see.
      placeholder: "e.g. Drops to ~40 FPS in World 4-6 with four players and many enemies on screen, fine with one player…"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach `console.log` from your newest run folder.
      render: text
  - type: input
    id: gpu
    attributes:
      label: GPU + driver version
      placeholder: "e.g. RTX 3060, driver 560.94"
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "e.g. Ryzen 5 5600"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true
