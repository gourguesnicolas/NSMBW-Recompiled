name: In-game bug report
description: Something looks, sounds, or behaves wrong (graphics, audio, input, saves) - but the game doesn't crash.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Where to find your logs** (paste the path into the File Explorer address bar):
        - `%LOCALAPPDATA%\WiiCompiled\Logs` (the runtime still uses this folder name)
        - A portable build keeps them in the `UserData\Logs` folder next to it.

        Every run gets its own folder. Open the **newest** one and attach `console.log`.

        For visual bugs, a screenshot or short clip helps enormously. Do not attach game files or disc images.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I'm on the latest commit of `main` (or the latest release, once there is one).
          required: true
        - label: I searched the existing issues and nobody has reported this yet.
          required: true
        - label: The problem does NOT also happen on Dolphin or a real Wii (if it does, it is in the game, not in this port). If this port differs from Dolphin, use the "Divergence" template instead.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The first lines of `console.log` start with `[runtime] WiiCompiled` followed by the version. For a build from source, give the commit hash.
      placeholder: "e.g. v0.1.0, or a1b2c3d"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: What kind of bug is it?
      options:
        - Graphics / visual glitch
        - Audio
        - Input / controllers (including tilt and shake)
        - Online / matchmaking
        - Gameplay behaves differently than on Wii/Dolphin
        - Save data / settings
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: Describe the bug and what you expected instead.
      placeholder: "e.g. The background layers flicker while scrolling in World 2-1…"
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing? / How to reproduce
      description: World and level, number of players, controller, and exact steps if you can reproduce it.
      placeholder: |
        1. Start World 1-1 with two players
        2. …
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot / video
      description: Drag & drop images or clips here (very helpful for visual bugs).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach `console.log` from your newest run folder, or paste the relevant part below.
      render: text
  - type: input
    id: gpu
    attributes:
      label: GPU + driver version
      placeholder: "e.g. RTX 3060, driver 560.94"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true
