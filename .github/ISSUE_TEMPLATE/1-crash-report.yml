name: Crash / freeze report
description: The game crashed, froze, or closed on its own.
title: "[Crash] "
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Crashes are almost impossible to fix without logs, so please fill this in fully.

        **Where to find your logs** (paste the path into the File Explorer address bar):
        - `%LOCALAPPDATA%\WiiCompiled\Logs` (the runtime still uses this folder name)
        - A portable build keeps them in the `UserData\Logs` folder next to it.

        Every run gets its own folder. Open the **newest** one and attach (drag & drop) `console.log` and any `crash_*.txt` file from it.

        Do not attach game files, disc images or translator output (see docs/LEGAL.md).
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I'm on the latest commit of `main` (or the latest release, once there is one).
          required: true
        - label: I searched the existing issues and nobody has reported this crash yet.
          required: true
        - label: The same disc image runs correctly on Dolphin.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The first lines of `console.log` start with `[runtime] WiiCompiled` followed by the version. For a build from source, give the commit hash.
      placeholder: "e.g. v0.1.0, or a1b2c3d"
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When does it crash?
      options:
        - During startup / before the title screen
        - On the title screen or in the menus
        - While loading a level or the world map
        - During a level (one player)
        - During a level (several players)
        - After completing a level
        - Randomly / no clear pattern
    validations:
      required: true
  - type: dropdown
    id: repro
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Most of the time
        - Sometimes
        - Happened only once so far
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing when it crashed?
      description: Level or world map position, how many players, the controller, anything you pressed right before. The more specific, the better.
      placeholder: "e.g. World 3-2, the second player was spinning on a seesaw platform, crashed as the midway flag was touched…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can make it crash on purpose, list the steps.
      placeholder: |
        1. Start the game
        2. …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag & drop `console.log` and any `crash_*.txt` from your newest run folder here, or paste the tail end of them below.
      render: text
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU + driver version
      placeholder: "e.g. RTX 3060, driver 560.94"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true
