    path: Assets/main.dol
    sha256: 0373b4dbffd7c9da9d27eb7257a7677877a3e33ceb81818bab1daa93560b9907

  # The four modules import from each other and are relocated together. BSS is given explicitly
  # because the game's loader (OSLinkFixed) puts it at load + fixSize, not after the whole file.
  rels:
    - path: Assets/d_profileNP.rel   # module 1
      load_address: 0x80768500
      bss_address: 0x8076D4A0
      sha256: d6b738eb779d0b0b48f0b6d350e8955d51cbbdf0fb46ffdb621d9538c8fd67c7
    - path: Assets/d_basesNP.rel     # module 2
