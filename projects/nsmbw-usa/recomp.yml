      sha256: 7f0fb0d0f91e4e82e3d01b9aee3546182fce7acfcd142e3f900dea9a5472f128
    - path: Assets/d_enemiesNP.rel   # module 3
      load_address: 0x809A2CE0
      bss_address: 0x80B11460
      sha256: 0f3af075bb64e86abfbcdb31def285f67557814656afde8aefa1dc3016e23f87
    - path: Assets/d_en_bossNP.rel   # module 4
      load_address: 0x80B1C960
      bss_address: 0x80B89AE0
      sha256: 8c5d5649d45b461061cd6e633909b9bd8bb9b0380f45745de0cf81cf2c5ca277

translation:
  entry_points:
    - 0x80004050
  # Seeds the modules' entry points, which the call-graph walk from __start cannot reach (the
  # game calls them through pointers read from the module headers).
  function_map:
    path: projects/nsmbw-usa/MAP.txt
  # Off: the first translation found no unsupported instruction (#9). The 81 `mfspr` comments in
  # the output only mark reads of privileged SPRs, which the runtime serves through PPC_ReadSpr.
  allow_unsupported_instructions: false

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/nsmbw_base_manifest.json
