  size: 0x01800000      # MEM1 (24 MiB); the DOL and all four modules end at 0x80B8E35C
  sda_base: 0x8042F680  # _SDA_BASE_  (r13), set in __init_registers at 0x800041C0
  sda2_base: 0x80433080 # _SDA2_BASE_ (r2),  set in __init_registers at 0x800041C0

