# New Super Mario Bros. Wii, North American release (SMNE01), revision 2.
# Every value comes from the owner's dump and from the game's module list in Dolphin; see README.md.
schema_version: 1
workspace_root: ../..

project:
  id: nsmbw-smne01
  display_name: NSMBW USA
  game_id: SMNE01
  region: E

memory:
